services:
  # FastAPI Backend Service with Persistent Disk for SQLite
  - type: web
    name: agri-price-prediction-backend
    env: python
    region: singapore
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PERSISTENT_DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.10.12

  # React Frontend Static Site
  - type: web
    name: agri-price-prediction-frontend
    env: static
    region: singapore
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agri-price-prediction-backend.onrender.com
